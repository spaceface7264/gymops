name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  database:
    name: Migrations and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Start local stack
        run: supabase start -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Apply migrations and seeds
        run: supabase db reset
      - name: pgTAP permission tests
        run: supabase test db

      # A migration merged without `npm run db:types` leaves the client types
      # silently wrong, which nothing else here would notice.
      - name: Generated types match the migrations
        run: |
          supabase gen types typescript --local --schema public > src/lib/database.types.ts
          git diff --exit-code src/lib/database.types.ts

  e2e:
    name: End-to-end flows
    runs-on: ubuntu-latest
    # The dev server is started by Playwright itself (playwright.config.ts) and
    # needs the same two variables a developer keeps in `.env.local`; these are
    # the local stack's published demo values, not secrets.
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: npm ci
      # Realtime stays in this time: the run screen subscribes to it, and a
      # missing container is a console error on the screen under test.
      - name: Start local stack
        run: supabase start -x imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Apply migrations and seeds
        run: supabase db reset
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The functions are Deno with their own imports, so ESLint and tsc skip
      # them (spec §5, P2-03). This is the only thing that type-checks them.
      - name: Type-check
        working-directory: supabase/functions
        run: deno check invite/index.ts notify/index.ts
      - name: Lint
        working-directory: supabase/functions
        run: deno lint
      - name: Format
        working-directory: supabase/functions
        run: deno fmt --check
