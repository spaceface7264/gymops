name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  database:
    name: Migrations and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Start local stack
        run: supabase start -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Apply migrations and seeds
        run: supabase db reset
      - name: pgTAP permission tests
        run: supabase test db

      # A migration merged without `npm run db:types` leaves the client types
      # silently wrong, which nothing else here would notice.
      - name: Generated types match the migrations
        run: |
          supabase gen types typescript --local --schema public > src/lib/database.types.ts
          git diff --exit-code src/lib/database.types.ts

  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The functions are Deno with their own imports, so ESLint and tsc skip
      # them (spec §5, P2-03). This is the only thing that type-checks them.
      - name: Type-check
        working-directory: supabase/functions
        run: deno check invite/index.ts
      - name: Lint
        working-directory: supabase/functions
        run: deno lint
      - name: Format
        working-directory: supabase/functions
        run: deno fmt --check
